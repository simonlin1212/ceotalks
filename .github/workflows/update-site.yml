# ceotalks.online 的线上更新：GitHub 的机器跑一轮 fetcher/（跟本仓库给大家的是同一份程序），
# 判完把 site/ 传到 Cloudflare。累积库放在本仓库的 data 分支，只留一个提交，每轮覆盖。
# 只在 simonlin1212/ceotalks 上跑；fork 后要自己用，改掉下面 jobs.update.if 里的仓库名，再按 README「部署上线」设好。
#
# 要的设置（仓库 Settings → Secrets and variables → Actions）：
#   vars.LEADERS_AI_URL            AI 接口地址（任何 OpenAI 兼容接口，写到 /chat/completions）
#   vars.LEADERS_AI_MODEL          模型名
#   secrets.LEADERS_AI_KEY         这个接口的 key；三样缺一样就不叫 AI
#   secrets.CLOUDFLARE_API_TOKEN   Cloudflare 令牌，能部署 Workers（用「编辑 Cloudflare Workers」模板建）
#   vars.CLOUDFLARE_ACCOUNT_ID     Cloudflare 账号 ID；这两样缺一样就不上传
# 都没设也能跑：只抓、不叫 AI、不上传，用来看 YouTube 让不让 GitHub 的机器搜。
#
# 护着线上数据：只有确认还没有 data 分支才按空库起；取不到、读不了库，或者跑完库里的条数掉了一半以上，
# 这一轮就停，不存、不传，等人看（本机跑时库读不了会挪成 store.json.bad-时间，这里那个文件留不下来，所以直接停）。
name: 更新网站

on:
  schedule:
    - cron: "17 */2 * * *"   # 每 2 小时一轮（UTC），避开整点那阵排队
  workflow_dispatch:
    inputs:
      only:
        description: 只跑这几个人（键用逗号隔开，空着就是全部）
        default: ""
      backfill:
        description: 搜今年的（第一次填库用），平时只搜本周
        type: boolean
        default: false
      ai:
        description: 叫不叫 AI（auto = 设好了就叫）
        type: choice
        options: [auto, "off"]
        default: auto
      save:
        description: 把累积库存回 data 分支
        type: boolean
        default: true
      deploy:
        description: 传到 Cloudflare
        type: boolean
        default: true

permissions:
  contents: write   # 存 data 分支

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'simonlin1212/ceotalks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 定时跑的时候没有 inputs，按默认：叫 AI、存库、上传
      SAVE: ${{ github.event_name == 'schedule' || inputs.save }}
      DEPLOY: ${{ github.event_name == 'schedule' || inputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: 不联网的测试
        run: python3 -I tests/test_offline.py

      - name: 取累积库（data 分支）
        run: |
          mkdir -p data
          rc=0
          git ls-remote --exit-code --heads origin data > /dev/null || rc=$?
          if [ "$rc" = 2 ]; then
            echo "还没有 data 分支，按空库起"
            echo "OLD_COUNT=0" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$rc" != 0 ]; then
            echo "::error::查不了 data 分支（退出码 $rc），这轮不跑"
            exit 1
          fi
          git fetch -q --depth=1 origin data
          git show FETCH_HEAD:store.json > data/store.json
          n=$(python3 -I -c 'import json, sys; v = json.load(open(sys.argv[1], encoding="utf-8"))["videos"]; assert isinstance(v, dict); print(len(v))' data/store.json) \
            || { echo "::error::data 分支上的库读不了，这轮不跑，等人看"; exit 1; }
          echo "库里 $n 条"
          echo "OLD_COUNT=$n" >> "$GITHUB_ENV"

      - name: 抓一轮
        env:
          ONLY: ${{ inputs.only }}
          BACKFILL: ${{ inputs.backfill }}
          AI_INPUT: ${{ inputs.ai }}
          LEADERS_AI_URL: ${{ vars.LEADERS_AI_URL }}
          LEADERS_AI_MODEL: ${{ vars.LEADERS_AI_MODEL }}
          LEADERS_AI_KEY: ${{ secrets.LEADERS_AI_KEY }}
          LEADERS_AI_TIMEOUT: "240"
          LEADERS_AI_MAX_TOKENS: "4096"   # 有的接口默认给得很少（Workers AI 只给 256），写不完一批
          LEADERS_MAX_PAGES: "0"          # GitHub 的机器开视频页第一下就要人机验证（10-28 实测三次都是），不开
        run: |
          if [ "$AI_INPUT" != off ] && [ -n "$LEADERS_AI_URL" ] && [ -n "$LEADERS_AI_MODEL" ] && [ -n "$LEADERS_AI_KEY" ]; then
            export LEADERS_AI=openai
          else
            export LEADERS_AI=off
          fi
          echo "AI：$LEADERS_AI ${LEADERS_AI_MODEL}"
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$BACKFILL" = true ] && args+=(--backfill)
          python3 -I fetcher/leaders.py "${args[@]}"

      - name: 看库有没有突然变少
        run: |
          n=$(python3 -I -c 'import json, sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["videos"]))' data/store.json)
          echo "跑完库里 $n 条（跑之前 $OLD_COUNT 条）"
          if [ "$OLD_COUNT" -gt 0 ] && [ $((n * 2)) -lt "$OLD_COUNT" ]; then
            echo "::error::库从 $OLD_COUNT 条掉到 $n 条，这轮不存、不传，等人看"
            exit 1
          fi

      - name: 存累积库
        if: env.SAVE == 'true'
        run: |
          blob=$(git hash-object -w data/store.json)
          tree=$(printf '100644 blob %s\tstore.json\n' "$blob" | git mktree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                   commit-tree "$tree" -m "data: $(date -u +%Y-%m-%dT%H:%MZ)")
          git push -q -f origin "$commit:refs/heads/data"
          echo "存好了"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        if: env.DEPLOY == 'true'
        with:
          node-version: 24

      - name: 装 wrangler（照 deploy/package-lock.json，版本和校验码都锁死；这步不给 Cloudflare 令牌）
        if: env.DEPLOY == 'true'
        run: npm ci --prefix deploy --no-audit --no-fund

      - name: 传到 Cloudflare
        if: env.DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "没设 Cloudflare 令牌或账号 ID，这轮不上传"
            exit 0
          fi
          deploy/node_modules/.bin/wrangler deploy --config deploy/wrangler.jsonc
